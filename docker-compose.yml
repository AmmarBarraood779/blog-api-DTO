services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog_api_app
    restart: unless-stopped
    working_dir: /var/www
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./:/var/www
    depends_on:
      - db
      - redis
    networks:
      - blog_network

  nginx:
    image: nginx:alpine
    container_name: blog_api_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - blog_network

  db:
    image: mysql:8.0
    container_name: blog_api_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: blog_db
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - blog_network

  redis:
    image: redis:alpine
    container_name: blog_api_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - blog_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: blog_api_pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    depends_on:
      - db
    networks:
      - blog_network

networks:
  blog_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local